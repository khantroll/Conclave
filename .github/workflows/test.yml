name: test

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src
      - name: Lint Python
        run: ruff check src tests
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/render.js
      - name: Test browser rendering (adversarial corpus)
        run: node --test web/render.test.mjs
      - name: Test
        run: pytest -q
